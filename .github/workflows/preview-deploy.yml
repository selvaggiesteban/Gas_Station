name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Deploy Preview
        id: deploy
        run: |
          set -euo pipefail
          # Deploy to a preview URL with PR number
          PREVIEW_NAME="app-pr-${{ github.event.number }}"
          wrangler deploy --name "${PREVIEW_NAME}" --env preview
          
          # Get the preview URL
          PREVIEW_URL="https://${PREVIEW_NAME}.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "Preview deployed: ${PREVIEW_URL}"
          echo "preview_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Preview Deployment Ready**\n\n' +
                '🔗 **URL:** ${{ steps.deploy.outputs.preview_url }}\n\n' +
                '> This preview will update automatically on new commits to this PR.\n' +
                '> It will be cleaned up when the PR is closed.'
            })

      - name: Cleanup Preview on Close
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: |
          set -euo pipefail
          PREVIEW_NAME="app-pr-${{ github.event.number }}"
          echo "Cleaning up preview: ${PREVIEW_NAME}"
          wrangler delete "${PREVIEW_NAME}" --env preview || true