name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Typecheck, test and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          ok=0
          for i in 1 2 3; do
            if npm ci --prefer-offline --no-audit --progress=false; then ok=1; break; fi
            echo "npm ci attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "npm ci failed after 3 attempts"; exit 1; fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply gas-station-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy
